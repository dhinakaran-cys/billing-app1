version: '3.8'

services:
  billing-app:
    build: .
    container_name: billing-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist the SQLite database across container restarts and updates
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
